name: Build and push Desktop template

on:
  push:
    paths:
      - 'template/**'
      - '.github/workflows/template.yml'
      - '.github/workflows/build_template_cluster.yml'
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: Target cluster (`all` = every production cluster)
        required: true
        type: choice
        default: all
        options:
          - all
          - foxtrot
          - juliett
          - tango

permissions:
  contents: read

jobs:
  # The DockerHub image is cluster-independent, so it is only rebuilt on pushes.
  buildAndPushImage:
    if: ${{ github.event_name == 'push' }}
    defaults:
      run:
        working-directory: ./template

    name: Build and Push Image to DockerHub
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: Parse .tool-versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1
        id: tool-versions
        with:
          filename: '.tool-versions'
          uppercase: 'true'
          prefix: 'tool_version_'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '${{ env.TOOL_VERSION_UV }}'
          python-version: '${{ env.TOOL_VERSION_PYTHON }}'
          working-directory: ./template

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to DockerHub
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/desktop:latest || true
          uv run python build_docker.py | docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/desktop:latest -f - files

  # The template is built on every production cluster. Clusters are separate
  # tenancies with separate template registries, so each needs its own build.
  # One job per cluster, each naming its secret statically, so a build job only
  # ever receives the one key it needs.
  foxtrot:
    name: foxtrot
    if: ${{ github.event_name == 'push' || inputs.target_environment == 'all' || inputs.target_environment == 'foxtrot' }}
    uses: ./.github/workflows/build_template_cluster.yml
    with:
      cluster: foxtrot
    secrets:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}

  juliett:
    name: juliett
    if: ${{ github.event_name == 'push' || inputs.target_environment == 'all' || inputs.target_environment == 'juliett' }}
    uses: ./.github/workflows/build_template_cluster.yml
    with:
      cluster: juliett
      E2B_DOMAIN: e2b-juliett.dev
    secrets:
      E2B_API_KEY: ${{ secrets.E2B_JULIETT_API_KEY }}

  tango:
    name: tango
    if: ${{ github.event_name == 'push' || inputs.target_environment == 'all' || inputs.target_environment == 'tango' }}
    uses: ./.github/workflows/build_template_cluster.yml
    with:
      cluster: tango
      E2B_DOMAIN: e2b-tango.dev
    secrets:
      E2B_API_KEY: ${{ secrets.E2B_TANGO_API_KEY }}
