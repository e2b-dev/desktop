name: Build and push Desktop template

on:
  push:
    paths:
      - 'template/**'
      - '.github/workflows/template.yml'
    branches:
      - main

permissions:
  contents: read

jobs:
  buildAndPublish:
    defaults:
      run:
        working-directory: ./template

    name: Build and Push Images
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: Parse .tool-versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1
        id: tool-versions
        with:
          filename: '.tool-versions'
          uppercase: 'true'
          prefix: 'tool_version_'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '${{ env.TOOL_VERSION_UV }}'
          python-version: '${{ env.TOOL_VERSION_PYTHON }}'
          working-directory: ./template

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to DockerHub
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/desktop:latest || true
          uv run python build_docker.py | docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/desktop:latest -f - files

      - name: Build E2B template
        run: uv run python build_prod.py
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
